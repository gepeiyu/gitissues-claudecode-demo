name: 🐛 Bug
description: 报一个问题，随手写
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: 什么问题
      description: 发生了什么，和期望的不一样在哪里
      placeholder: "登录后 30 分钟 session 就没了，需要重新登录"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 怎么复现
      description: 能稳定复现最好，不能的话说一下触发条件
      placeholder: |
        1. 登录
        2. 等 30 分钟不操作
        3. 刷新页面 → 跳回登录页
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - P0 - 功能完全不可用
        - P1 - 核心功能受影响
        - P2 - 有影响但有绕过方法
        - P3 - 轻微，体验问题
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 补充信息
      description: 错误日志、截图、相关代码位置，有就填
    validations:
      required: false
