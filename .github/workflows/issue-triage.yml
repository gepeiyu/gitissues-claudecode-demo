name: Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Add needs-triage label
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --add-label "needs-triage"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on P0
        if: contains(toJSON(github.event.issue.labels.*.name), 'P0')
        run: |
          echo "P0 issue created: ${{ github.event.issue.title }}"
          # 替换为你的 Slack webhook 或其他通知方式
          # curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
          #   -H 'Content-type: application/json' \
          #   -d '{"text":"🚨 P0: ${{ github.event.issue.title }}\n${{ github.event.issue.html_url }}"}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
